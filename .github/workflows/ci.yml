name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"
          terraform_wrapper: false

      - name: terraform fmt check
        run: terraform fmt -check -recursive tf/

      - name: terraform validate (each module)
        run: |
          set -e
          # Modules excluded from CI validate (each with a documented reason in the module's README):
          #   tf/secrets-manager/mcp-namespace — cyberark/conjur provider's ValidateConfig
          #     rejects var-referenced attributes as "empty" against the raw AST. plan + apply
          #     work because they resolve variables first. See module README.
          EXCLUDE_RE='^tf/secrets-manager/mcp-namespace$'

          for dir in $(find tf -mindepth 2 -maxdepth 4 -type f -name 'main.tf' -exec dirname {} \;); do
            if [[ "$dir" =~ $EXCLUDE_RE ]]; then
              echo "=== skipping $dir (excluded from validate — see README) ==="
              continue
            fi
            echo "=== validating $dir ==="
            (cd "$dir" && terraform init -backend=false -input=false && terraform validate -no-color)
          done

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        env:
          # SC1091: we source siblings via known relative path (CI can't follow at lint time)
          # SC2155: declare/assign-separately — cosmetic for our short jq one-liners
          SHELLCHECK_OPTS: -e SC1091 -e SC2155

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: karancode/yamllint-github-action@master
        with:
          yamllint_strict: false
          yamllint_comment: false
          yamllint_config_filepath: .yamllint.yml

  mkdocs:
    name: mkdocs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs + Material + plugins
        run: |
          pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build catalog pages
        run: python docs/_build.py

      - name: Build site (strict)
        run: mkdocs build --strict
