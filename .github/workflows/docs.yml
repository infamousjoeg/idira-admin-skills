name: Build and deploy docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - tf/**/README.md
      - tf/**/AGENTS.md
      - scripts/**/README.md
      - scripts/**/AGENTS.md
      - .claude/skills/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # for `mkdocs build` to know revision dates

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs + Material + plugins
        run: |
          pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build catalog pages from tf/ and scripts/
        run: python docs/_build.py

      - name: Build site
        run: mkdocs build --strict --verbose

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
